syntax = "proto3";

package log_aggregator.schema;

message FileEvents {
  message DataAvailable {
    uint32 id = 1;
    string data = 2;
  }

  message FileError {
    uint32 id = 1;
    string error = 2;
  }

  message FileClosed {
    uint32 id = 1;
  }

  oneof event_type {
    DataAvailable data_available = 1;
    FileError file_error = 2;
    FileClosed file_closed = 3;
  }
}
